[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seoscout"
version = "0.1.0"
description = "Keyword research & content collection CLI for SEO — search YouTube and Google, extract transcripts and web content, output structured JSON."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Claire" },
]
keywords = ["seo", "keyword-research", "content-collection", "youtube", "web-scraping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Text Processing",
]
dependencies = [
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
    "youtube-transcript-api>=0.6",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
seoscout = "seoscout.cli:main"

[tool.setuptools.packages.find]
include = ["seoscout*"]
